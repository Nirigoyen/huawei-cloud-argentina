apiVersion: cci/v2
kind: Deployment
metadata:
  name: demo-frontend
  namespace: demo-cci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-frontend
  template:
    metadata:
      labels:
        app: demo-frontend
      annotations:
        resource.cci.io/instance-type: general-computing
    spec:
      imagePullSecrets:
        - name: imagepull-secret
      containers:
        - name: frontend-nginx
          image: swr.la-south-2.myhuaweicloud.com/demo-cci/frontend:latest
          env:
            - name: BACKEND_HOST
              value: backend-svc
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 512Mi
          ports:
            - containerPort: 80
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - demo-frontend
                topologyKey: topology.kubernetes.io/zone
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
---
apiVersion: cci/v2
kind: Service
metadata:
  name: demo-frontend-svc
  namespace: demo-cci
  annotations:
    kubernetes.io/elb.class: elb
    kubernetes.io/elb.id: "<PEGAR_TU_ELB_ID_AQUI>"
spec:
  selector:
    app: demo-frontend
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
