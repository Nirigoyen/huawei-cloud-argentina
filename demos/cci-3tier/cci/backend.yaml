apiVersion: cci/v2
kind: Deployment
metadata:
  name: demo-backend
  namespace: demo-cci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
      annotations:
        resource.cci.io/instance-type: general-computing
    spec:
      imagePullSecrets:
        - name: imagepull-secret
      containers:
        - name: backend-api
          image: swr.la-south-2.myhuaweicloud.com/demo-cci/backend:latest
          env:
            - name: REDIS_HOST
              value: redis-svc
            - name: MENSAJE_DEMO
              value: '¡Hola desde el backend en Huawei CCI!'
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 512Mi
          ports:
            - containerPort: 8080
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - demo-backend
                topologyKey: topology.kubernetes.io/zone
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
---
apiVersion: cci/v2
kind: Service
metadata:
  name: backend-svc
  namespace: demo-cci
spec:
  selector:
    app: demo-backend
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
