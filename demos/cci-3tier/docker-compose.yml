services:
  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      - REDIS_HOST=redis
      - MENSAJE_DEMO=¡Hola desde el backend!
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    ports:
      - "8081:80"
