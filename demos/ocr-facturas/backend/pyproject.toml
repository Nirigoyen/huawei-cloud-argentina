[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-facturas-backend"
version = "0.1.0"
description = "OCR Facturas - Argentine Invoice OCR Processing Backend"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "structlog>=24.1.0",
    "tenacity>=8.5.0",
    "psycopg2-binary>=2.9.9",
    "PyMySQL>=1.1.1",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the standard pattern
    "N818",   # Exception suffix convention — AppException is a deliberate choice
    "E402",   # Module-level import not at top — conditional imports in FastAPI
    "B904",   # raise ... from err — to be addressed in follow-up
    "SIM102", # Nested if — style preference
    "SIM108", # Ternary operator — style preference
    "SIM105", # contextlib.suppress — style preference
    "SIM201", # != instead of not == — style preference
    "B007",   # Loop control variable not used — minor
    "F841",   # Local variable assigned but unused — to be addressed in follow-up
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]