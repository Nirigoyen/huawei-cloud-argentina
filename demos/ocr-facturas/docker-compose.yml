# ============================================================================
# OCR Facturas — Docker Compose
# Starts the full stack: PostgreSQL, Backend, Frontend, Dify (API + Worker + Web + DB + Redis + Weaviate)
#
# Usage:
#   cp .env.example .env   # Create and edit your .env file
#   docker compose up -d   # Start all services
#
# After startup, import the Dify workflow:
#   1. Open http://localhost:3001 (Dify Web UI)
#   2. Create an account / login
#   3. Import "OCR Test.yml" as a workflow
#   4. Set the Dify API key in your .env file
#   5. Restart backend: docker compose restart backend
# ============================================================================

services:
  # =========================================================================
  # Application PostgreSQL — separate from Dify's PostgreSQL
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ocr-facturas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocrfacturas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ocrfacturas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocrfacturas} -d ${POSTGRES_DB:-ocrfacturas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ocr-network

  # =========================================================================
  # Backend — FastAPI application
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-facturas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ocrfacturas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ocrfacturas}
      CHATBOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ocrfacturas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ocrfacturas}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Auth
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Dify Console
      DIFY_CONSOLE_EMAIL: ${DIFY_CONSOLE_EMAIL}
      DIFY_CONSOLE_PASSWORD: ${DIFY_CONSOLE_PASSWORD}
      # File upload
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      # Huawei Cloud IAM credentials
      HUAWEI_IAM_USERNAME: ${HWCLOUD_IAM_USERNAME:-}
      HUAWEI_IAM_PASSWORD: ${HWCLOUD_IAM_PASSWORD:-}
      HUAWEI_PROJECT_ID: ${HWCLOUD_PROJECT_ID:-}
      HUAWEI_REGION: ${HWCLOUD_REGION:-ap-southeast-1}
      # Dify integration
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://dify-api:5001}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORKFLOW_ID: ${DIFY_WORKFLOW_ID:-}
      # MaaS (Huawei Cloud Model-as-a-Service)
      MAAS_API_KEY: ${MAAS_API_KEY:-}
      MAAS_BASE_URL: ${MAAS_BASE_URL:-https://maas.ap-southeast-1.myhuaweicloud.com/v1}
      MAAS_MODEL_NAME: ${MAAS_MODEL_NAME:-deepseek-v3}
      # Destination Database (Data Forward)
      DESTINATION_DB_TYPE: ${DESTINATION_DB_TYPE:-}
      DESTINATION_DB_HOST: ${DESTINATION_DB_HOST:-}
      DESTINATION_DB_PORT: ${DESTINATION_DB_PORT:-}
      DESTINATION_DB_NAME: ${DESTINATION_DB_NAME:-}
      DESTINATION_DB_USERNAME: ${DESTINATION_DB_USERNAME:-}
      DESTINATION_DB_PASSWORD: ${DESTINATION_DB_PASSWORD:-}
      DESTINATION_DB_TABLE: ${DESTINATION_DB_TABLE:-invoices}
      DATA_FORWARD_ENABLED: ${DATA_FORWARD_ENABLED:-false}
      DATA_FORWARD_URL: ${DATA_FORWARD_URL:-}
      # Timeouts
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      CHATBOT_QUERY_TIMEOUT_SECONDS: ${CHATBOT_QUERY_TIMEOUT_SECONDS:-5}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ocr-network

  # =========================================================================
  # Frontend — React + Vite served by nginx
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-facturas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ocr-network

  # =========================================================================
  # Dify API — Workflow engine
  # =========================================================================
  dify-api:
    image: langgenius/dify-api:1.0.0
    container_name: ocr-facturas-dify-api
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      # Mode
      MODE: api
      # Run migrations on startup
      MIGRATION_ENABLED: "true"
      # Application secret
      SECRET_KEY: ${DIFY_SECRET_KEY}
      # Database
      DB_USERNAME: ${DIFY_DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB_NAME:-dify}
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-}
      # Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /var/dify/storage
      # Volumes
      VOLUMES: /var/dify/storage
      # Logging
      LOG_LEVEL: INFO
      # Weaviate (vector DB — can be disabled)
      WEAVIATE_ENDPOINT: ${DIFY_WEAVIATE_ENDPOINT:-http://dify-weaviate:8080}
      VECTOR_TYPE: ${DIFY_VECTOR_TYPE:-weaviate}
      # Sandbox
      SANDBOX_HOST: dify-sandbox
      # Code execution endpoint — must match the Docker service name.
      # Default in Dify is "http://sandbox:8194" but our service is "dify-sandbox".
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY}
      # Plugin Daemon (Dify 1.0.0 requirement)
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-}
      # Public URLs (must be accessible from browser)
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:3001}
      CONSOLE_WEB_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:3001}
      APP_WEB_URL: ${DIFY_APP_API_URL:-http://localhost:3001}
      SERVICE_API_URL: ${DIFY_APP_API_URL:-http://localhost:3001}
      # Celery broker
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://dify-redis:6379/1}
      # HTTP proxy (for external API calls from within Dify)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,dify-api,dify-worker,dify-web,dify-db,dify-redis,dify-plugin-daemon}
    volumes:
      - dify-storage:/var/dify/storage
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Worker — Background task processing (Celery)
  # =========================================================================
  dify-worker:
    image: langgenius/dify-api:1.0.0
    container_name: ocr-facturas-dify-worker
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      # Mode — this runs as a Celery worker, not API
      MODE: worker
      # Application secret
      SECRET_KEY: ${DIFY_SECRET_KEY}
      # Database
      DB_USERNAME: ${DIFY_DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB_NAME:-dify}
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-}
      # Celery broker
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://dify-redis:6379/1}
      # Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /var/dify/storage
      VOLUMES: /var/dify/storage
      # Logging
      LOG_LEVEL: INFO
      # Weaviate
      WEAVIATE_ENDPOINT: ${DIFY_WEAVIATE_ENDPOINT:-http://dify-weaviate:8080}
      VECTOR_TYPE: ${DIFY_VECTOR_TYPE:-weaviate}
      # Sandbox
      SANDBOX_HOST: dify-sandbox
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY}
      # Plugin Daemon
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-}
      # HTTP proxy
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,dify-api,dify-worker,dify-web,dify-db,dify-redis,dify-plugin-daemon}
    volumes:
      - dify-storage:/var/dify/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import celery; print(\"ok\")' || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Web — Web UI for managing workflows (Next.js frontend)
  # =========================================================================
  dify-web:
    image: langgenius/dify-web:1.0.0
    container_name: ocr-facturas-dify-web
    restart: unless-stopped
    depends_on:
      dify-api:
        condition: service_healthy
    environment:
      # The web container proxies API requests to dify-api
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:3001}
      APP_API_URL: ${DIFY_APP_API_URL:-http://localhost:3001}
    # Port 3000 is exposed internally only (via dify-proxy)
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://$(hostname -i):3000/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Plugin Daemon — Plugin execution service (Dify 1.0.0 requirement)
  # =========================================================================
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: ocr-facturas-dify-plugin-daemon
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 5002
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_USERNAME: ${DIFY_DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_DATABASE: dify_plugin
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      FORCE_VERIFYING_SIGNATURE: "false"
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-}
      PLATFORM: local
    volumes:
      - dify-storage:/app/storage
    networks:
      - ocr-network

  # =========================================================================
  # Dify Proxy — Nginx reverse proxy for Dify services
  # Routes /console/api/, /api/, /v1/, /files/ to dify-api
  # Routes / to dify-web (Next.js frontend)
  # =========================================================================
  dify-proxy:
    image: nginx:alpine
    container_name: ocr-facturas-dify-proxy
    restart: unless-stopped
    depends_on:
      dify-api:
        condition: service_healthy
      dify-web:
        condition: service_healthy
    volumes:
      - ./dify-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Sandbox — Code execution sandbox for workflow nodes
  # =========================================================================
  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: ocr-facturas-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${DIFY_SANDBOX_API_KEY}
      # Provide CA certificates so sandboxed Python/Node can verify HTTPS
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # The sandbox runs Python/Node code in an isolated environment using
    # Linux namespaces and seccomp. To allow network access from sandboxed
    # code (e.g., HTTP requests to OCR API, LLM API), the container needs:
    #   - SYS_ADMIN capability (to create network namespaces)
    #   - seccomp:unconfined (to allow socket syscalls)
    # Without these, sandboxed code gets "operation not permitted" on any
    # network operation.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    # The sandbox uses nsjail for code isolation. It needs privileged mode
    # to create nested network namespaces and allow sandboxed code to make
    # network calls (DNS resolution, HTTP requests to OCR/LLM APIs).
    # Without privileged mode, sandboxed code gets "operation not permitted"
    # on socket operations even when the sandbox config says "network enabled".
    privileged: true
    # The sandbox looks for resolv.conf at /run/resolvconf/resolv.conf and
    # /run/systemd/resolve/stub-resolv.conf to copy into the chroot.
    # Docker containers don't have these paths by default, so we use an
    # entrypoint wrapper to create them before starting the sandbox server.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /run/resolvconf && cp /etc/resolv.conf /run/resolvconf/resolv.conf && mkdir -p /run/systemd/resolve && cp /etc/resolv.conf /run/systemd/resolve/stub-resolv.conf && exec /main"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ocr-network

  # =========================================================================
  # Dify PostgreSQL — Separate database for Dify (not shared with app)
  # =========================================================================
  dify-db:
    image: postgres:16-alpine
    container_name: ocr-facturas-dify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DIFY_DB_USERNAME:-dify}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD}
      POSTGRES_DB: ${DIFY_DB_NAME:-dify}
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIFY_DB_USERNAME:-dify} -d ${DIFY_DB_NAME:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Redis — Message broker and cache for Dify
  # =========================================================================
  dify-redis:
    image: redis:7-alpine
    container_name: ocr-facturas-dify-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - dify-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ocr-network

  # =========================================================================
  # Dify Weaviate — Vector database for Dify (optional, can be disabled)
  # =========================================================================
  dify-weaviate:
    image: semitechnologies/weaviate:1.25.6
    container_name: ocr-facturas-dify-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      ENABLE_MODULES: text2vec-openai
      CLUSTER_HOSTNAME: node1
    volumes:
      - dify-weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ocr-network

# =============================================================================
# Volumes — persistent data storage
# =============================================================================
volumes:
  postgres-data:
    driver: local
  dify-db-data:
    driver: local
  dify-redis-data:
    driver: local
  dify-storage:
    driver: local
  dify-weaviate-data:
    driver: local
  uploads:
    driver: local

# =============================================================================
# Network — all services share the same network for DNS-based service discovery
# =============================================================================
networks:
  ocr-network:
    driver: bridge