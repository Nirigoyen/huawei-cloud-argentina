        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: DeepSeek-V3
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 0042655d-9e3b-445e-ae0a-ed40e10614ae
          role: system
          text: "Analiza el siguiente texto obtenido mediante OCR y extrae la información\
            \ relevante del comprobante.\n\nDevuelve la información respetando exactamente\
            \ el siguiente formato:\n\nINFORMACIÓN DEL COMPROBANTE\nTipo de comprobante:\n\
            Letra:\nCódigo de comprobante:\nPunto de venta:\nNúmero de comprobante:\n\
            Número completo:\nFecha de emisión:\nMoneda:\nTipo de cambio:\n\nDATOS\
            \ DEL EMISOR\nNombre de fantasía:\nNombre o razón social:\nCUIT:\nCondición\
            \ fiscal:\nDomicilio:\nLocalidad:\nProvincia:\nCódigo postal:\nTeléfono:\n\
            Inicio de actividades:\n\nDATOS DEL CLIENTE\nNombre o razón social:\n\
            Tipo de documento:\nNúmero de documento:\nCondición fiscal:\nDomicilio:\n\
            Localidad:\nProvincia:\nCódigo postal:\nTeléfono:\nCondición de venta:\n\
            \nPRODUCTOS O SERVICIOS\nCódigo | Descripción | Cantidad | Unidad | Precio\
            \ unitario | Bonificación | Subtotal sin IVA | Alícuota IVA | Total con\
            \ IVA\n\nTOTALES\nImporte neto gravado:\nIVA:\nOtros tributos:\nTotal\
            \ en moneda del comprobante:\nTotal equivalente en pesos:\n\nAUTORIZACIÓN\n\
            CAE:\nFecha de vencimiento del CAE:\n\nREGLAS GENERALES\n\n- Mantén cada\
            \ dato en su campo correspondiente.\n- No coloques domicilio, teléfono,\
            \ condición fiscal u otros datos dentro del nombre del emisor o del cliente.\n\
            - No agregues explicaciones, introducciones, conclusiones ni texto adicional.\n\
            - Respeta exactamente los títulos, los campos y el orden indicados.\n\
            - Si un dato no aparece o no puede identificarse con suficiente seguridad,\
            \ escribe \"No encontrado\".\n- No inventes información.\n- Conserva los\
            \ ceros iniciales del punto de venta, número de comprobante y códigos.\n\
            - Separa el punto de venta del número de comprobante.\n- Forma el número\
            \ completo utilizando el formato PUNTO_DE_VENTA-NÚMERO_DE_COMPROBANTE.\n\
            - Si el documento contiene CUIT, identifica el tipo de documento como\
            \ CUIT.\n- Si contiene DNI, identifica el tipo de documento como DNI.\n\
            - No confundas el CUIT del emisor con el CUIT o documento del cliente.\n\
            - No confundas Ingresos Brutos con el CUIT.\n- No confundas el subtotal\
            \ sin IVA con el total con IVA.\n- No confundas el importe en moneda extranjera\
            \ con su equivalente en pesos argentinos.\n- No incluyas tablas de tributos\
            \ como productos o servicios.\n- Ignora logos, códigos QR, textos legales,\
            \ leyendas institucionales y textos ilegibles que no sean relevantes para\
            \ los campos solicitados.\n\nREGLAS PARA EL NOMBRE DEL EMISOR\n\n- En\
            \ \"Nombre de fantasía\" conserva solamente la marca o nombre comercial\
            \ principal.\n- No incluyas slogans, subtítulos, descripciones del sistema\
            \ ni textos pequeños ubicados debajo o alrededor del logo.\n- En \"Nombre\
            \ o razón social\" utiliza exclusivamente el dato asociado con etiquetas\
            \ como \"Razón Social\", \"Nombre y Apellido\" o equivalentes.\n- No reemplaces\
            \ una razón social por el nombre de fantasía.\n\nREGLAS PARA LA LETRA\
            \ Y EL CÓDIGO DEL COMPROBANTE\n\n- Primero busca visualmente la letra\
            \ A, B, C, E o M en el texto OCR.\n- Si la letra no fue reconocida, determínala\
            \ únicamente a partir del código de comprobante.\n- Normaliza el código\
            \ de comprobante a tres dígitos. Por ejemplo, COD.01 debe mostrarse como\
            \ 001 y COD.11 como 011.\n- El código puede aparecer como COD.01, COD.001,\
            \ Cód. 01, Cód. 001 u otros formatos equivalentes.\n\nCorrespondencias:\n\
            \n- Códigos 001, 002 o 003: letra A\n- Códigos 006, 007 u 008: letra B\n\
            - Códigos 011, 012 o 013: letra C\n- Códigos 019, 020 o 021: letra E\n\
            - Códigos 051, 052 o 053: letra M\n\n- Esta conversión entre código y\
            \ letra es la única deducción permitida.\n- Si la letra no aparece y el\
            \ código no coincide con ninguno de los anteriores, escribe \"No encontrado\"\
            .\n- No confundas el código del comprobante con la letra.\n\nREGLAS PARA\
            \ PRODUCTOS Y SERVICIOS\n\n- Crea una fila por cada producto o servicio.\n\
            - Respeta el orden en el que aparecen en el documento.\n- Extrae código,\
            \ descripción, cantidad, unidad, precio unitario, bonificación, subtotal\
            \ sin IVA, alícuota de IVA y total con IVA.\n- Si un campo de una fila\
            \ no aparece, escribe \"No encontrado\" solamente en ese campo.\n- Si\
            \ la tabla informa \"Subtotal con IVA\", utilízalo como \"Total con IVA\"\
            .\n- Si la tabla solo informa el importe final de la línea, colócalo en\
            \ \"Total con IVA\" cuando el documento indique que incluye IVA.\n- No\
            \ calcules valores que no estén expresados claramente, salvo operaciones\
            \ aritméticas directas e inequívocas.\n- Corrige errores evidentes del\
            \ OCR en palabras comunes y unidades. Por ejemplo:\n  - \"undades\" debe\
            \ interpretarse como \"unidades\".\n  - \"Cudad\" debe interpretarse como\
            \ \"Ciudad\".\n  - \"VA Responsable Inscripio\" debe interpretarse como\
            \ \"IVA Responsable Inscripto\".\n- No corrijas ni alteres códigos de\
            \ producto, CUIT, DNI, CAE, fechas, números de comprobante o importes.\n\
            \nREGLAS PARA MONEDA, IMPORTES E IMPUESTOS\n\n- Identifica la moneda principal\
            \ del comprobante.\n- Utiliza códigos de moneda:\n  - ARS para pesos argentinos.\n\
            \  - USD para dólares estadounidenses.\n  - EUR para euros.\n- Incluye\
            \ siempre la moneda delante de cada importe.\n- Formatea los importes\
            \ usando punto como separador de miles y coma como separador decimal.\n\
            - Ejemplos:\n  - 10000,00 debe mostrarse como 10.000,00.\n  - 12100,00\
            \ debe mostrarse como 12.100,00.\n  - 786500,00 debe mostrarse como 786.500,00.\n\
            - Mantén siempre dos decimales en importes.\n- Los porcentajes deben incluir\
            \ el símbolo %.\n- Ejemplo: una bonificación de 0.00 debe mostrarse como\
            \ 0,00%.\n- Si aparecen una o varias alícuotas de IVA, incluye cada alícuota\
            \ y su importe en el campo IVA.\n- Ejemplo:\n  IVA: 21%: USD 2.100,00\n\
            - Si existen varias alícuotas, sepáralas con punto y coma.\n- Si no hay\
            \ otros tributos o todos tienen importe cero, escribe el importe cero\
            \ con su moneda.\n- En \"Total en moneda del comprobante\" utiliza el\
            \ total expresado en la moneda principal.\n- En \"Total equivalente en\
            \ pesos\" utiliza solamente el importe convertido a pesos argentinos.\n\
