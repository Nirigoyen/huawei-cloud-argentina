    - data:
        code: "import requests\nimport base64\nimport re\nfrom urllib.parse import\
          \ urlparse\n\n\ndef limpiar_texto(texto):\n    if texto is None:\n     \
          \   return \"\"\n\n    texto = str(texto).replace(\"\\r\\n\", \"\\n\").replace(\"\
          \\r\", \"\\n\")\n\n    lineas = []\n\n    for linea in texto.split(\"\\\
          n\"):\n        linea = re.sub(r\"[ \\t]+\", \" \", linea).strip()\n\n  \
          \      if linea:\n            lineas.append(linea)\n\n    return \"\\n\"\
          .join(lineas)\n\n\ndef extraer_texto_estructurado(respuesta):\n    paginas\
          \ = respuesta.get(\"result\", [])\n\n    if isinstance(paginas, dict):\n\
          \        paginas = [paginas]\n\n    if not isinstance(paginas, list):\n\
          \        return \"\", 0\n\n    salida = []\n    cantidad_bloques = 0\n\n\
          \    for numero_pagina, pagina in enumerate(paginas, start=1):\n\n     \
          \   if len(paginas) > 1:\n            salida.append(f\"===== PÁGINA {numero_pagina}\
          \ =====\")\n\n        layout_blocks = (\n            pagina\n          \
          \  .get(\"layout_result\", {})\n            .get(\"layout_block_list\",\
          \ [])\n        )\n\n        # Principal: usar la estructura generada por\
          \ Huawei.\n        if layout_blocks:\n            for bloque in layout_blocks:\n\
          \                tipo = bloque.get(\"type\", \"text\")\n               \
          \ texto = limpiar_texto(bloque.get(\"text\"))\n\n                if not\
          \ texto:\n                    continue\n\n                salida.append(f\"\
          [{tipo}] {texto}\")\n                cantidad_bloques += 1\n\n        #\
          \ Fallback, solamente si Huawei no devolvió layout.\n        else:\n   \
          \         words_blocks = (\n                pagina\n                .get(\"\
          ocr_result\", {})\n                .get(\"words_block_list\", [])\n    \
          \        )\n\n            for bloque in words_blocks:\n                texto\
          \ = limpiar_texto(bloque.get(\"words\"))\n\n                if not texto:\n\
          \                    continue\n\n                salida.append(f\"[text]\
          \ {texto}\")\n                cantidad_bloques += 1\n\n        if numero_pagina\
          \ < len(paginas):\n            salida.append(\"\")\n\n    return \"\\n\"\
          .join(salida).strip(), cantidad_bloques\n\n\ndef main(url: str, token: str)\
          \ -> dict:\n    try:\n        token = re.sub(r\"\\s+\", \"\", token or \"\
          \")\n\n        if not token:\n            return {\n                \"estado\"\
          : \"ERROR: token vacío\",\n                \"ocr_status\": 0,\n        \
          \        \"bloques\": 0,\n                \"texto_limpio\": \"\"\n     \
          \       }\n\n        # Convertir URL de Dify a URL interna.\n        parsed\
          \ = urlparse(url)\n\n        ruta = parsed.path\n\n        if parsed.query:\n\
          \            ruta += \"?\" + parsed.query\n\n        if ruta.startswith(\"\
          /api/files\"):\n            ruta = ruta.replace(\"/api/files\", \"/files\"\
          , 1)\n\n        url_interna = \"http://api:5001\" + ruta\n\n        # Descargar\
          \ imagen.\n        res_img = requests.get(\n            url_interna,\n \
          \           timeout=30\n        )\n\n        if res_img.status_code != 200:\n\
          \            return {\n                \"estado\": (\n                 \
          \   \"ERROR descargando archivo: \"\n                    + str(res_img.status_code)\n\
          \                ),\n                \"ocr_status\": 0,\n              \
          \  \"bloques\": 0,\n                \"texto_limpio\": res_img.text[:1000]\n\
          \            }\n\n        if not res_img.content:\n            return {\n\
          \                \"estado\": \"ERROR: archivo vacío\",\n               \
          \ \"ocr_status\": 0,\n                \"bloques\": 0,\n                \"\
          texto_limpio\": \"\"\n            }\n\n        imagen_b64 = base64.b64encode(\n\
          \            res_img.content\n        ).decode(\"ascii\")\n\n        # Llamar\
          \ a Huawei OCR.\n        huawei_url = (\n            \"https://ocr.ap-southeast-1.myhuaweicloud.com/\"\
          \n            \"v2/ID_PROYECTO_HONG_KONG/\"\n            \"ocr/smart-document-recognizer\"\
          \n        )\n\n        headers = {\n            \"Content-Type\": \"application/json\"\
          ,\n            \"X-Auth-Token\": token\n        }\n\n        payload = {\n\
          \            \"data\": imagen_b64,\n            \"single_orientation_mode\"\
          : True,\n            \"language\": \"es\",\n            \"layout\": True,\n\
          \            \"table\": True,\n            \"kv\": False,\n            \"\
          form\": False\n        }\n\n        res_ocr = requests.post(\n         \
          \   huawei_url,\n            headers=headers,\n            json=payload,\n\
          \            timeout=120\n        )\n\n        if res_ocr.status_code !=\
          \ 200:\n            return {\n                \"estado\": (\n          \
          \          \"ERROR Huawei OCR: \"\n                    + str(res_ocr.status_code)\n\
          \                ),\n                \"ocr_status\": res_ocr.status_code,\n\
          \                \"bloques\": 0,\n                \"texto_limpio\": res_ocr.text[:2000]\n\
          \            }\n\n        try:\n            respuesta = res_ocr.json()\n\
          \        except ValueError:\n            return {\n                \"estado\"\
          : \"ERROR: Huawei no devolvió JSON válido\",\n                \"ocr_status\"\
          : res_ocr.status_code,\n                \"bloques\": 0,\n              \
          \  \"texto_limpio\": res_ocr.text[:2000]\n            }\n\n        texto_limpio,\
          \ cantidad_bloques = (\n            extraer_texto_estructurado(respuesta)\n\
          \        )\n\n        if not texto_limpio:\n            return {\n     \
          \           \"estado\": \"OCR OK, pero sin bloques de texto\",\n       \
          \         \"ocr_status\": res_ocr.status_code,\n                \"bloques\"\
          : 0,\n                \"texto_limpio\": \"\"\n            }\n\n        return\
          \ {\n            \"estado\": \"OCR OK\",\n            \"ocr_status\": res_ocr.status_code,\n\
          \            \"bloques\": cantidad_bloques,\n            \"texto_limpio\"\
          : texto_limpio\n        }\n\n    except requests.Timeout:\n        return\
          \ {\n            \"estado\": \"ERROR: timeout\",\n            \"ocr_status\"\
          : 0,\n            \"bloques\": 0,\n            \"texto_limpio\": \"\"\n\
          \        }\n\n    except Exception as error:\n        return {\n       \
          \     \"estado\": (\n                f\"ERROR {type(error).__name__}: {str(error)}\"\
          \n            ),\n            \"ocr_status\": 0,\n            \"bloques\"\
          : 0,\n            \"texto_limpio\": \"\"\n        }"
        code_language: python3
        outputs:
          bloques:
            children: null
            type: number
          estado:
            children: null
            type: string
          ocr_status:
            children: null
            type: number
          texto_limpio:
            children: null
            type: string
