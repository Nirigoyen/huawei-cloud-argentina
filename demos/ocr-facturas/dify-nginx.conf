# ============================================================================
# OCR Facturas — Dify Nginx Reverse Proxy
# Routes requests to the appropriate Dify backend services:
#   - /console/api/  -> dify-api (Dify Console API)
#   - /api/          -> dify-api (Dify App API)
#   - /v1/           -> dify-api (Dify Workflow API — used by backend)
#   - /files/        -> dify-api (Dify File Storage)
#   - /              -> dify-web (Dify Next.js Frontend)
# ============================================================================

server {
    listen 3001;
    server_name _;

    # Docker DNS resolver - re-resolve every 5s to handle container restarts
    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 100M;

    # ------------------------------------------------------------------
    # Iframe embedding — allow OCR Facturas app (port 3000) to embed Dify UI
    # ------------------------------------------------------------------
    # X-Frame-Options: deprecated but kept for legacy browser compatibility.
    # "ALLOWALL" is non-standard but widely supported by nginx; effectively
    # removes the restriction.  Modern browsers honour CSP frame-ancestors
    # instead (see below).
    add_header X-Frame-Options ALLOWALL always;

    # Content-Security-Policy: frame-ancestors controls which origins may
    # embed this page in an iframe.  'self' allows direct access to Dify,
    # while the two http origins allow the OCR Facturas app (production IP
    # and localhost for local development) to embed Dify in an iframe.
    add_header Content-Security-Policy "frame-ancestors 'self' http://10.0.0.41:3000 http://176.52.142.209:3000 http://localhost:3000;" always;

    # ------------------------------------------------------------------
    # Dify Console API — admin/management operations
    # ------------------------------------------------------------------
    location /console/api/ {
        # CORS — allow cross-origin requests from the OCR Facturas app
        add_header Access-Control-Allow-Origin "http://10.0.0.41:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;

        # Handle CORS preflight (OPTIONS) requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://dify-api:5001/console/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # ------------------------------------------------------------------
    # Dify App API — application-level API calls
    # ------------------------------------------------------------------
    location /api/ {
        # CORS — allow cross-origin requests from the OCR Facturas app
        add_header Access-Control-Allow-Origin "http://10.0.0.41:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;

        # Handle CORS preflight (OPTIONS) requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://dify-api:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # ------------------------------------------------------------------
    # Dify Workflow API — /v1/ paths (e.g., /v1/workflows/run, /v1/files/upload)
    # Used by the backend dify_service.py to call the Dify workflow API.
    # Without this block, /v1/ requests fall through to dify-web (Next.js)
    # which returns 404.
    # ------------------------------------------------------------------
    location /v1/ {
        # CORS — allow cross-origin requests from the OCR Facturas app
        add_header Access-Control-Allow-Origin "http://10.0.0.41:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;

        # Handle CORS preflight (OPTIONS) requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://dify-api:5001/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # ------------------------------------------------------------------
    # Dify File Storage — uploaded files
    # ------------------------------------------------------------------
    location /files/ {
        # CORS — allow cross-origin requests from the OCR Facturas app
        add_header Access-Control-Allow-Origin "http://10.0.0.41:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;

        # Handle CORS preflight (OPTIONS) requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://dify-api:5001/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # ------------------------------------------------------------------
    # Catch-all — Dify Web UI (Next.js frontend)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://dify-web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}